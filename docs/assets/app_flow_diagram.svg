<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2e"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Header -->
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#goldGrad)"/>
    <text x="19" y="26" fill="#ffffff" font-weight="bold" font-size="20" text-anchor="middle">সা</text>
    <text x="50" y="24" fill="#ffffff" font-weight="700" font-size="22">AI-SATHI</text>
    <text x="160" y="24" fill="#f59e0b" font-weight="600" font-size="13" letter-spacing="1">END-TO-END APPLICATION &amp; DECISION FLOW</text>
    <text x="50" y="44" fill="#94a3b8" font-size="13">Conversational Intent Routing, Dialect Normalization, and Human-in-the-Loop Confirmation</text>
  </g>

  <!-- STEP 1: USER INPUT -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="220" height="38" rx="12" fill="#1e293b"/>
    <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">1. User Interaction</text>

    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="190" height="45" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="20" fill="#38bdf8" font-size="11" font-weight="600">🎙️ Spoken Voice Audio</text>
      <text x="10" y="36" fill="#94a3b8" font-size="10">"ধান বিক্রি করেছি ১২০০ টাকা"</text>

      <rect x="0" y="55" width="190" height="45" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="75" fill="#f59e0b" font-size="11" font-weight="600">⌨️ Banglish / Bengali Text</text>
      <text x="10" y="91" fill="#94a3b8" font-size="10">"sorser tel 39 taka legeche"</text>

      <rect x="0" y="110" width="190" height="45" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="130" fill="#a855f7" font-size="11" font-weight="600">💬 General Chit-Chat</text>
      <text x="10" y="146" fill="#94a3b8" font-size="10">"নমস্কার! কেমন আছেন দি?"</text>
    </g>
  </g>

  <!-- STEP 2: STT & TRANSLATION -->
  <g transform="translate(330, 110)">
    <rect x="0" y="0" width="230" height="230" rx="12" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="230" height="38" rx="12" fill="#2e1065"/>
    <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">2. Sarvam Translation / STT</text>

    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="200" height="75" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
      <text x="10" y="22" fill="#c084fc" font-size="12" font-weight="600">Saaras v4 (saaras:v4)</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">• Auto Language Detect</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">• mode='verbatim' 16000Hz</text>

      <rect x="0" y="85" width="200" height="75" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
      <text x="10" y="107" fill="#c084fc" font-size="12" font-weight="600">Mayura v1 (mayura:v1)</text>
      <text x="10" y="127" fill="#94a3b8" font-size="10">• Rural Slang Normalizer</text>
      <text x="10" y="143" fill="#94a3b8" font-size="10">• 'sorser tel' -> 'সর্ষের তেল'</text>
    </g>
  </g>

  <!-- STEP 3: INTENT ROUTER -->
  <g transform="translate(610, 110)">
    <rect x="0" y="0" width="230" height="230" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="230" height="38" rx="12" fill="#78350f"/>
    <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">3. Intent Classifier (105B)</text>

    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="200" height="45" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="20" fill="#10b981" font-size="11" font-weight="600">Branch A: Financial Ledger</text>
      <text x="10" y="36" fill="#94a3b8" font-size="10">Income, Expense, Loans, Kisti</text>

      <rect x="0" y="55" width="200" height="45" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="75" fill="#38bdf8" font-size="11" font-weight="600">Branch B: Direct Chit-Chat</text>
      <text x="10" y="91" fill="#94a3b8" font-size="10">Greetings, FAQs (No Ledger DB)</text>

      <rect x="0" y="110" width="200" height="45" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="130" fill="#a855f7" font-size="11" font-weight="600">Branch C: Context Follow-Up</text>
      <text x="10" y="146" fill="#94a3b8" font-size="10">"39 niyeche ota" (Recalls Item)</text>
    </g>
  </g>

  <!-- STEP 4: DECISION & EXECUTION (BOTTOM HALF) -->
  <g transform="translate(60, 400)">
    <!-- Branch A Box: Confirmation Loop -->
    <rect x="0" y="0" width="500" height="300" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="500" height="38" rx="12" fill="#064e3b"/>
    <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">Branch A: Interactive Ledger Confirmation &amp; Persistence</text>

    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="24" fill="#f59e0b" font-size="12" font-weight="600">AI Prompts in Bengali:</text>
      <text x="15" y="44" fill="#e2e8f0" font-size="11">"আমি আপনার হিসাবটি গুছিয়ে নিয়েছি। আপনি কি নিশ্চিত করতে চান যে: সর্ষের তেল ₹৩৯ খরচ? (হ্যাঁ/না)"</text>

      <!-- Yes Path -->
      <g transform="translate(0, 75)">
        <rect x="0" y="0" width="220" height="150" rx="8" fill="#0f172a" stroke="#10b981"/>
        <text x="15" y="24" fill="#10b981" font-size="12" font-weight="700">User says 'হ্যাঁ' / 'ha'</text>
        <text x="15" y="48" fill="#94a3b8" font-size="11">• Commit to PostgreSQL DB</text>
        <text x="15" y="68" fill="#94a3b8" font-size="11">• Update User Net Balance</text>
        <text x="15" y="88" fill="#94a3b8" font-size="11">• Push to Live Drawer UI</text>
        <text x="15" y="108" fill="#94a3b8" font-size="11">• Reply: "সফলভাবে সংরক্ষিত"</text>
      </g>

      <!-- No Path -->
      <g transform="translate(240, 75)">
        <rect x="0" y="0" width="220" height="150" rx="8" fill="#0f172a" stroke="#f43f5e"/>
        <text x="15" y="24" fill="#f43f5e" font-size="12" font-weight="700">User says 'না' / 'na'</text>
        <text x="15" y="48" fill="#94a3b8" font-size="11">• Discard Pending Entry</text>
        <text x="15" y="68" fill="#94a3b8" font-size="11">• Save to Context Memory</text>
        <text x="15" y="88" fill="#94a3b8" font-size="11">• 0 Database Writes</text>
        <text x="15" y="108" fill="#94a3b8" font-size="11">• Reply: "হিসাবটি বাদ দেওয়া হলো"</text>
      </g>
    </g>
  </g>

  <!-- Branch B Box: Chit-Chat Direct -->
  <g transform="translate(610, 400)">
    <rect x="0" y="0" width="530" height="300" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="530" height="38" rx="12" fill="#0c4a6e"/>
    <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">Branch B &amp; C: Direct Dialogue &amp; Context Corrections</text>

    <g transform="translate(20, 55)">
      <!-- Chit-chat node -->
      <rect x="0" y="0" width="490" height="100" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="600">Sarvam 105B Conversations (Direct Response):</text>
      <text x="15" y="46" fill="#e2e8f0" font-size="11">"নমস্কার দি, আমি খুব ভালো আছি। আজ আপনার হিসাব বা বাজারের বিষয়ে কি সাহায্য করতে পারি?"</text>
      <text x="15" y="70" fill="#94a3b8" font-size="10">✓ 100% Conversational Separation • Zero interference with Ledger Database</text>

      <!-- Context follow-up node -->
      <rect x="0" y="115" width="490" height="110" rx="8" fill="#0f172a" stroke="#a855f7"/>
      <text x="15" y="139" fill="#c084fc" font-size="12" font-weight="600">Contextual Correction ("39 niyeche ota"):</text>
      <text x="15" y="161" fill="#e2e8f0" font-size="11">1. Recalls rejected item from memory: 'সর্ষের তেল' (Mustard Oil)</text>
      <text x="15" y="181" fill="#e2e8f0" font-size="11">2. Updates amount to ₹39 and re-prompts confirmation instantly</text>
      <text x="15" y="201" fill="#94a3b8" font-size="10">✓ Handles multi-turn corrections without forcing user to repeat item name</text>
    </g>
  </g>

  <!-- Flow Arrows -->
  <path d="M 280 220 L 330 220" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
  <path d="M 560 220 L 610 220" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
  <path d="M 720 340 L 720 370 L 310 370 L 310 400" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <path d="M 720 340 L 720 370 L 870 370 L 870 400" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowGold)"/>
</svg>