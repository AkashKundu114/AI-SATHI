<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2e"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>
    
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Header -->
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#goldGrad)"/>
    <text x="19" y="26" fill="#ffffff" font-weight="bold" font-size="20" text-anchor="middle">সা</text>
    <text x="50" y="24" fill="#ffffff" font-weight="700" font-size="22" letter-spacing="0.5">AI-SATHI</text>
    <text x="160" y="24" fill="#f59e0b" font-weight="600" font-size="13" letter-spacing="1">SYSTEM ARCHITECTURE</text>
    <text x="50" y="44" fill="#94a3b8" font-size="13">Production Release • Multi-Container Docker Architecture &amp; Sarvam Middleman Integration</text>
  </g>

  <!-- ================= LAYER 1: CLIENTS ================= -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="240" height="670" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="240" height="42" rx="14" fill="#1e293b" fill-opacity="0.8"/>
    <circle cx="20" cy="21" r="5" fill="#3b82f6"/>
    <text x="35" y="26" fill="#f8fafc" font-size="13" font-weight="600">1. Client &amp; Input Layer</text>

    <g transform="translate(15, 60)">
      <!-- React SPA -->
      <rect x="0" y="0" width="210" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="15" y="28" fill="#38bdf8" font-size="13" font-weight="600">🌐 React 18 Web App</text>
      <text x="15" y="50" fill="#94a3b8" font-size="11">• Obsidian / Gold Luxe Theme</text>
      <text x="15" y="68" fill="#94a3b8" font-size="11">• Real-time Financial Drawer</text>
      <text x="15" y="86" fill="#94a3b8" font-size="11">• Fast Voice Recorder (WebM)</text>
      <text x="15" y="104" fill="#94a3b8" font-size="11">• Multi-category Quick Chips</text>

      <!-- WhatsApp -->
      <rect x="0" y="140" width="210" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="15" y="168" fill="#22c55e" font-size="13" font-weight="600">💬 WhatsApp Business</text>
      <text x="15" y="190" fill="#94a3b8" font-size="11">• Meta Cloud Webhook API</text>
      <text x="15" y="208" fill="#94a3b8" font-size="11">• WhatsApp Native Flows (Forms)</text>
      <text x="15" y="226" fill="#94a3b8" font-size="11">• Interactive Quick Buttons</text>
      <text x="15" y="244" fill="#94a3b8" font-size="11">• Voice Note Dispatch</text>

      <!-- Voice Mic -->
      <rect x="0" y="280" width="210" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="15" y="308" fill="#f59e0b" font-size="13" font-weight="600">🎙️ Spoken Audio Input</text>
      <text x="15" y="330" fill="#94a3b8" font-size="11">• Rural Bengali Dialect Streams</text>
      <text x="15" y="348" fill="#94a3b8" font-size="11">• 16kHz WebM / OGG / WAV</text>
      <text x="15" y="366" fill="#94a3b8" font-size="11">• Code-Mixed Banglish Speech</text>
      <text x="15" y="384" fill="#94a3b8" font-size="11">• Live Noise Suppression</text>

      <!-- Docs & Images -->
      <rect x="0" y="420" width="210" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="15" y="448" fill="#a855f7" font-size="13" font-weight="600">📄 Physical Docs &amp; Vision</text>
      <text x="15" y="470" fill="#94a3b8" font-size="11">• Handwritten Chits &amp; Bills</text>
      <text x="15" y="488" fill="#94a3b8" font-size="11">• SHG Bank Passbooks (PDF)</text>
      <text x="15" y="506" fill="#94a3b8" font-size="11">• Rural Product Photos</text>
      <text x="15" y="524" fill="#94a3b8" font-size="11">• Multi-page PDF Uploads</text>
    </g>
  </g>

  <!-- ================= LAYER 2: GATEWAY & ENGINE ================= -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="260" height="670" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="260" height="42" rx="14" fill="#1e293b" fill-opacity="0.8"/>
    <circle cx="20" cy="21" r="5" fill="#f59e0b"/>
    <text x="35" y="26" fill="#f8fafc" font-size="13" font-weight="600">2. Gateway &amp; State Engine</text>

    <g transform="translate(15, 60)">
      <!-- FastAPI Edge -->
      <rect x="0" y="0" width="230" height="80" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="15" y="24" fill="#38bdf8" font-size="13" font-weight="600">⚡ FastAPI Edge Gateway</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">• JWT Auth &amp; Phone Verification</text>
      <text x="15" y="62" fill="#94a3b8" font-size="11">• HMAC-SHA256 Signature Check</text>

      <!-- Input Guard -->
      <rect x="0" y="95" width="230" height="80" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="15" y="119" fill="#f43f5e" font-size="13" font-weight="600">🛡️ Input Guard &amp; Normalizer</text>
      <text x="15" y="139" fill="#94a3b8" font-size="11">• PostgreSQL Dedup Table</text>
      <text x="15" y="157" fill="#94a3b8" font-size="11">• Bengali Dialect Pre-normalizer</text>

      <!-- LangGraph Engine -->
      <rect x="0" y="190" width="230" height="390" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#glowGold)"/>
      <text x="15" y="218" fill="#f59e0b" font-size="13" font-weight="700">🔄 LangGraph State Engine</text>
      <text x="15" y="238" fill="#94a3b8" font-size="11">PostgreSQL Thread Checkpointing</text>

      <g transform="translate(10, 250)">
        <rect x="0" y="0" width="210" height="48" rx="6" fill="#1e293b"/>
        <text x="10" y="20" fill="#e2e8f0" font-size="11" font-weight="600">🔀 Intent Router Node</text>
        <text x="10" y="38" fill="#94a3b8" font-size="10">Financial vs Chit-Chat vs Market</text>

        <rect x="0" y="56" width="210" height="48" rx="6" fill="#1e293b"/>
        <text x="10" y="76" fill="#e2e8f0" font-size="11" font-weight="600">📝 Ledger Extraction Node</text>
        <text x="10" y="94" fill="#94a3b8" font-size="10">8-Type Financial NER + Math</text>

        <rect x="0" y="112" width="210" height="48" rx="6" fill="#1e293b"/>
        <text x="10" y="132" fill="#e2e8f0" font-size="11" font-weight="600">❓ Confirmation Node</text>
        <text x="10" y="150" fill="#94a3b8" font-size="10">Interactive Bengali Yes/No Loop</text>

        <rect x="0" y="168" width="210" height="48" rx="6" fill="#1e293b"/>
        <text x="10" y="188" fill="#e2e8f0" font-size="11" font-weight="600">💬 Direct Dialogue Node</text>
        <text x="10" y="206" fill="#94a3b8" font-size="10">Zero Ledger DB Writes for Chat</text>

        <rect x="0" y="224" width="210" height="48" rx="6" fill="#1e293b"/>
        <text x="10" y="244" fill="#e2e8f0" font-size="11" font-weight="600">🧠 Context Memory Node</text>
        <text x="10" y="262" fill="#94a3b8" font-size="10">Multi-turn Modification Tracking</text>

        <rect x="0" y="280" width="210" height="42" rx="6" fill="#1e293b"/>
        <text x="10" y="300" fill="#e2e8f0" font-size="11" font-weight="600">📊 PDF Statement Generator</text>
      </g>
    </g>
  </g>

  <!-- ================= LAYER 3: SARVAM AI MIDDLEMAN ================= -->
  <g transform="translate(610, 100)">
    <rect x="0" y="0" width="280" height="670" rx="14" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="280" height="42" rx="14" fill="#2e1065" fill-opacity="0.8"/>
    <circle cx="20" cy="21" r="5" fill="#a855f7"/>
    <text x="35" y="26" fill="#f8fafc" font-size="13" font-weight="600">3. Sarvam AI Middleman Layer</text>

    <g transform="translate(15, 60)">
      <!-- Saaras v4 -->
      <rect x="0" y="0" width="250" height="85" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="15" y="26" fill="#c084fc" font-size="13" font-weight="600">🎤 Saaras v4 (saaras:v4)</text>
      <text x="15" y="46" fill="#94a3b8" font-size="11">• Speech-to-Text • 23 Indic Languages</text>
      <text x="15" y="64" fill="#94a3b8" font-size="11">• mode='verbatim' | 16kHz Sampling</text>

      <!-- Mayura v1 -->
      <rect x="0" y="95" width="250" height="85" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="15" y="121" fill="#c084fc" font-size="13" font-weight="600">🌐 Mayura v1 (mayura:v1)</text>
      <text x="15" y="141" fill="#94a3b8" font-size="11">• Dialect Translation &amp; Bridging</text>
      <text x="15" y="159" fill="#94a3b8" font-size="11">• mode='modern-colloquial'</text>

      <!-- Sarvam 105B -->
      <rect x="0" y="190" width="250" height="100" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="15" y="216" fill="#c084fc" font-size="13" font-weight="600">🧠 Sarvam 105B (sarvam-105b)</text>
      <text x="15" y="236" fill="#94a3b8" font-size="11">• 128K Context Reasoning</text>
      <text x="15" y="254" fill="#94a3b8" font-size="11">• Financial NER &amp; Profit/Loss Math</text>
      <text x="15" y="272" fill="#94a3b8" font-size="11">• Market Pricing Advice</text>

      <!-- Sarvam 105B Conversations -->
      <rect x="0" y="300" width="250" height="85" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="15" y="326" fill="#c084fc" font-size="13" font-weight="600">💬 Sarvam 105B Conversations</text>
      <text x="15" y="346" fill="#94a3b8" font-size="11">• Dialogue-Tuned Empathetic Chat</text>
      <text x="15" y="364" fill="#94a3b8" font-size="11">• Zero Ledger Impact Chit-Chat</text>

      <!-- Parse Document AI -->
      <rect x="0" y="395" width="250" height="85" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="15" y="421" fill="#c084fc" font-size="13" font-weight="600">📑 Sarvam Parse (Doc AI)</text>
      <text x="15" y="441" fill="#94a3b8" font-size="11">• doc-ai/v1/job/digitise</text>
      <text x="15" y="459" fill="#94a3b8" font-size="11">• Layout-Aware Table &amp; Receipt OCR</text>

      <!-- Vision -->
      <rect x="0" y="490" width="250" height="75" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="15" y="516" fill="#c084fc" font-size="13" font-weight="600">👁️ Sarvam Vision</text>
      <text x="15" y="536" fill="#94a3b8" font-size="11">• Multi-modal Product Inspection</text>
      <text x="15" y="554" fill="#94a3b8" font-size="11">• Catalog Poster Generation</text>
    </g>
  </g>

  <!-- ================= LAYER 4: STORAGE ================= -->
  <g transform="translate(920, 100)">
    <rect x="0" y="0" width="230" height="670" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="230" height="42" rx="14" fill="#064e3b" fill-opacity="0.8"/>
    <circle cx="20" cy="21" r="5" fill="#10b981"/>
    <text x="35" y="26" fill="#f8fafc" font-size="13" font-weight="600">4. Persistence Substrate</text>

    <g transform="translate(15, 60)">
      <!-- PostgreSQL -->
      <rect x="0" y="0" width="200" height="300" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="28" fill="#34d399" font-size="14" font-weight="700">🐘 PostgreSQL 16</text>
      <text x="15" y="48" fill="#6ee7b7" font-size="11" font-weight="600">+ pgvector Extension</text>

      <g transform="translate(10, 65)">
        <rect x="0" y="0" width="180" height="40" rx="5" fill="#1e293b"/>
        <text x="10" y="20" fill="#e2e8f0" font-size="11" font-weight="600">📋 ledger_entries</text>
        <text x="10" y="34" fill="#94a3b8" font-size="10">8 Transaction Modes</text>

        <rect x="0" y="48" width="180" height="40" rx="5" fill="#1e293b"/>
        <text x="10" y="68" fill="#e2e8f0" font-size="11" font-weight="600">👥 users &amp; auth</text>
        <text x="10" y="82" fill="#94a3b8" font-size="10">JWT Tokens &amp; Credentials</text>

        <rect x="0" y="96" width="180" height="40" rx="5" fill="#1e293b"/>
        <text x="10" y="116" fill="#e2e8f0" font-size="11" font-weight="600">🔄 checkpoints</text>
        <text x="10" y="130" fill="#94a3b8" font-size="10">LangGraph Thread State</text>

        <rect x="0" y="144" width="180" height="40" rx="5" fill="#1e293b"/>
        <text x="10" y="164" fill="#e2e8f0" font-size="11" font-weight="600">🛡️ dedup &amp; audit_logs</text>
        <text x="10" y="178" fill="#94a3b8" font-size="10">HMAC Replay Protection</text>

        <rect x="0" y="192" width="180" height="35" rx="5" fill="#1e293b"/>
        <text x="10" y="214" fill="#e2e8f0" font-size="11">📊 K-Anon Price Records</text>
      </g>

      <!-- Azurite -->
      <rect x="0" y="320" width="200" height="150" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="348" fill="#34d399" font-size="14" font-weight="700">☁️ Azure Blob / Azurite</text>
      <text x="15" y="368" fill="#94a3b8" font-size="11">Binary Object Storage</text>

      <g transform="translate(10, 385)">
        <rect x="0" y="0" width="180" height="32" rx="5" fill="#1e293b"/>
        <text x="10" y="20" fill="#e2e8f0" font-size="11">🖼️ Generated Catalog Posters</text>

        <rect x="0" y="38" width="180" height="32" rx="5" fill="#1e293b"/>
        <text x="10" y="58" fill="#e2e8f0" font-size="11">📄 PDF Monthly Statements</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 290 220 L 320 220" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 290 440 L 320 440" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowGold)"/>
  <path d="M 580 360 L 610 360" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 610 400 L 580 400" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 580 570 L 920 570" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowEmerald)"/>
</svg>