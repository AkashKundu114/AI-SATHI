[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sathi"
version = "2.0.0"
description = "Voice-first WhatsApp financial assistant for rural micro-entrepreneurs"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
authors = [{name = "Akash Kundu", email = "akashkundu1152@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "uvicorn",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
