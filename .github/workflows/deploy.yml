name: Deploy AI-SATHI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-sathi:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ai-sathi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/ai-sathi

            sed -i "s|image: ghcr.io/.*/ai-sathi:.*|image: ghcr.io/${{ github.repository_owner }}/ai-sathi:${{ github.sha }}|" docker-compose.prod.yml

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            sleep 20
            docker compose -f docker-compose.prod.yml ps gateway | grep -q "Up" || {
              echo "gateway container is not up after deploy"
              docker compose -f docker-compose.prod.yml logs --tail=100 gateway
              exit 1
            }
